name: Buscar leituras
on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: 'Dias para trás'
        default: '10'
permissions:
  contents: write
jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/buscar.py
        env:
          DAYS: ${{ github.event.inputs.days || '10' }}
      - name: Commit
        run: |
          git config user.name "movh-leituras-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "leituras: $(date +%F)" && git push)
